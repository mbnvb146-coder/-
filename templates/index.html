<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 블로그 자동 작성기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: #f5f5f5; color: #333; }

  .header {
    background: #03C75A;
    padding: 20px 0;
    text-align: center;
    color: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .header p { font-size: 14px; opacity: 0.9; margin-top: 4px; }

  .container { max-width: 760px; margin: 40px auto; padding: 0 20px; }

  .card {
    background: white;
    border-radius: 16px;
    padding: 36px 40px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  .card h2 { font-size: 20px; font-weight: 700; margin-bottom: 24px; color: #111; }

  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #444; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 12px 16px;
    border: 1.5px solid #ddd; border-radius: 10px;
    font-size: 15px; outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus { border-color: #03C75A; }
  .form-group textarea { height: 80px; resize: vertical; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

  .btn-generate {
    width: 100%; padding: 16px;
    background: #03C75A; color: white;
    border: none; border-radius: 12px;
    font-size: 17px; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
    margin-top: 8px;
  }
  .btn-generate:hover { background: #02a84a; }
  .btn-generate:disabled { background: #aaa; cursor: not-allowed; }

  .progress { display: none; margin-top: 24px; }
  .progress-bar {
    height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: #03C75A; border-radius: 3px;
    animation: progress 2s ease-in-out infinite;
  }
  @keyframes progress {
    0% { width: 10%; } 50% { width: 75%; } 100% { width: 90%; }
  }
  .progress-text { text-align: center; margin-top: 12px; font-size: 14px; color: #666; }

  .steps {
    display: flex; gap: 12px; margin-top: 16px;
    flex-wrap: wrap;
  }
  .step-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; background: #f0faf5; border-radius: 20px;
    font-size: 13px; color: #555;
  }
  .step-item .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ccc; flex-shrink: 0;
  }
  .step-item.active .dot { background: #03C75A; animation: pulse 1s infinite; }
  .step-item.done .dot { background: #03C75A; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.4); } }

  .error-msg {
    display: none; margin-top: 16px; padding: 14px 18px;
    background: #fff0f0; border: 1px solid #ffcccc;
    border-radius: 10px; color: #cc0000; font-size: 14px;
  }

  .tip-box {
    margin-top: 28px; padding: 16px 20px;
    background: #f8fbff; border-radius: 12px;
    border: 1px solid #e0ecff;
  }
  .tip-box p { font-size: 13px; color: #555; line-height: 1.7; }
  .tip-box strong { color: #03C75A; }
</style>
</head>
<body>

<div class="header">
  <h1>📝 네이버 블로그 자동 작성기</h1>
  <p>GPT-4 + DALL-E 3으로 블로그 글과 이미지를 자동 생성합니다</p>
</div>

<div class="container">
  <div class="card">
    <h2>블로그 글 생성하기</h2>

    <form id="generateForm">
      <div class="form-group">
        <label>📌 블로그 주제 <span style="color:#cc0000">*</span></label>
        <input type="text" name="topic" id="topic"
          placeholder="예: 제주도 여행 맛집 추천, 홈카페 레시피, 다이어트 식단 관리..."
          required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>✍️ 글 스타일</label>
          <select name="style" id="style">
            <option value="정보성">정보성</option>
            <option value="리뷰">리뷰</option>
            <option value="일상">일상</option>
            <option value="레시피">레시피</option>
            <option value="여행기">여행기</option>
          </select>
        </div>
        <div class="form-group">
          <label>🎨 문체 톤</label>
          <select name="tone" id="tone">
            <option value="친근한">친근한</option>
            <option value="전문적인">전문적인</option>
            <option value="감성적인">감성적인</option>
            <option value="유머러스한">유머러스한</option>
          </select>
        </div>
        <div class="form-group">
          <label>🖼️ 이미지 수</label>
          <select name="image_count" id="image_count">
            <option value="1">1장</option>
            <option value="2" selected>2장</option>
            <option value="3">3장</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-generate" id="generateBtn">
        ✨ 블로그 글 자동 생성
      </button>
    </form>

    <div class="progress" id="progress">
      <div class="progress-bar"><div class="progress-bar-fill"></div></div>
      <div class="progress-text" id="progressText">AI가 글을 작성 중입니다...</div>
      <div class="steps">
        <div class="step-item" id="step1"><div class="dot"></div>글 작성 중</div>
        <div class="step-item" id="step2"><div class="dot"></div>이미지 생성 중</div>
        <div class="step-item" id="step3"><div class="dot"></div>최종 조합 중</div>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="tip-box">
      <p>💡 <strong>팁:</strong> 구체적인 주제를 입력할수록 더 좋은 결과물이 나옵니다.<br>
      예) "제주도" → "제주도 서귀포 카페거리 감성 맛집 5곳"</p>
    </div>
  </div>
</div>

<script>
const form = document.getElementById('generateForm');
const btn = document.getElementById('generateBtn');
const progress = document.getElementById('progress');
const progressText = document.getElementById('progressText');
const errorMsg = document.getElementById('errorMsg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '⏳ 생성 중...';
  progress.style.display = 'block';

  setStep(1);
  progressText.textContent = 'GPT-4가 블로그 글을 작성 중입니다...';

  const fd = new FormData(form);

  // 단계 시뮬레이션
  setTimeout(() => { setStep(2); progressText.textContent = 'DALL-E 3가 이미지를 생성 중입니다...'; }, 3000);
  setTimeout(() => { setStep(3); progressText.textContent = '글과 이미지를 조합하는 중입니다...'; }, 12000);

  try {
    const res = await fetch('/api/generate', { method: 'POST', body: fd });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || '생성 실패');
    }

    progress.style.display = 'none';
    window.location.href = `/review/${data.draft_id}`;
  } catch (err) {
    progress.style.display = 'none';
    btn.disabled = false;
    btn.textContent = '✨ 블로그 글 자동 생성';
    errorMsg.style.display = 'block';
    errorMsg.textContent = '오류: ' + err.message;
  }
});

function setStep(n) {
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById('step' + i);
    el.classList.remove('active', 'done');
    if (i < n) el.classList.add('done');
    if (i === n) el.classList.add('active');
  }
}
</script>
</body>
</html>
