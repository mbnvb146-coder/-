<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CapCut Agent</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fafafa;font-family:'SF Mono',monospace;display:flex;
  align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{background:#161616;border:1px solid #262626;border-radius:12px;
  padding:40px;max-width:480px;width:100%;text-align:center}
.dot{width:12px;height:12px;border-radius:50%;background:#22c55e;
  box-shadow:0 0 12px #22c55e;margin:0 auto 24px}
h1{font-size:20px;font-weight:700;margin-bottom:8px}
p{color:#737373;font-size:13px;line-height:1.7;margin-bottom:32px}
.upload-btn{display:inline-block;background:#22c55e;color:#000;font-weight:700;
  font-size:13px;padding:12px 28px;border-radius:8px;cursor:pointer;
  font-family:inherit;border:none;transition:background .15s}
.upload-btn:hover{background:#16a34a}
.status{margin-top:20px;font-size:12px;color:#525252}
</style>
</head>
<body>
<div class="card">
  <div class="dot"></div>
  <h1>CapCut Agent</h1>
  <p>영상을 업로드하면<br>무음 컷 + 자막 자동 생성 →<br>CapCut 드래프트 파일로 출력합니다</p>
  <button class="upload-btn" onclick="document.getElementById('f').click()">영상 선택하기</button>
  <input type="file" id="f" accept="video/*" style="display:none" onchange="upload(this)">
  <div class="status" id="status"></div>
</div>
<script>
async function upload(input) {
  const file = input.files[0];
  if (!file) return;
  const st = document.getElementById('status');
  st.textContent = '업로드 중…';
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch('/upload', {method:'POST', body:fd});
    const d = await r.json();
    st.textContent = '✓ 업로드 완료 — 처리 시작 중…';
    // TODO: SSE progress
  } catch(e) {
    st.textContent = '오류: ' + e.message;
  }
}
</script>
</body>
</html>
